name: sync-v110

# 仅手动触发：GitHub Actions 出口无法访问 aka.doubaocdn.com（curl exit 35），
# 自动同步不可用，保留此文件供有外网出口的环境手动运行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: pull files
        continue-on-error: true
        run: |
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/56L2J7mfJB" -o index.js || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/fWK1Nat90e" -o tools.js || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/9MSzF5EWB9" -o style.css || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/JitGFuLu5S" -o adv-tools-v20.js || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/2zL29XhhVl" -o manifest.json || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/mA11y57UTK" -o README.md || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/H77J4DJTGf" -o docs/v1.10-batch-ops.md || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/Q0YpubBTDG" -o install.sh || exit 0
          curl -fsSL -k --retry 2 "https://aka.doubaocdn.com/s/ajorCuHE98" -o install.ps1 || exit 0
      - name: commit
        continue-on-error: true
        run: |
          git config user.name "st-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "release: v1.10 (manual sync)" || echo "no change"
          git push || echo "push failed"
