name: sync-v110

on:
  push:
    paths:
      - '.github/workflows/sync-v110.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pull files
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/56L2J7mfJB" -o index.js
          curl -fsSL "https://aka.doubaocdn.com/s/fWK1Nat90e" -o tools.js
          curl -fsSL "https://aka.doubaocdn.com/s/9MSzF5EWB9" -o style.css
          curl -fsSL "https://aka.doubaocdn.com/s/JitGFuLu5S" -o adv-tools-v20.js
          curl -fsSL "https://aka.doubaocdn.com/s/2zL29XhhVl" -o manifest.json
          curl -fsSL "https://aka.doubaocdn.com/s/mA11y57UTK" -o README.md
          curl -fsSL "https://aka.doubaocdn.com/s/H77J4DJTGf" -o docs/v1.10-batch-ops.md
          curl -fsSL "https://aka.doubaocdn.com/s/Q0YpubBTDG" -o install.sh
          curl -fsSL "https://aka.doubaocdn.com/s/ajorCuHE98" -o install.ps1
      - name: verify
        run: |
          test -s index.js && test -s tools.js && test -s style.css && test -s adv-tools-v20.js
          node --check index.js && node --check tools.js
          ls -l index.js tools.js style.css adv-tools-v20.js manifest.json
      - name: commit
        run: |
          git config user.name "st-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "release: v1.10 批量操作块 + 计划卡 + 流式 (auto-sync)" || echo "no change"
          git push
