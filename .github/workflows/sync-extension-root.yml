name: sync-extension-root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[sync]')
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.31.0 package to extension root
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 -o /tmp/pkg.zip "https://aka.doubaocdn.com/s/KJK5pzlBlL"
          ls -l /tmp/pkg.zip
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && unzip -o -q /tmp/pkg.zip -d /tmp/pkg
          cp -fR /tmp/pkg/st-agent/. .
          git config user.name 'st-agent-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 照抄写卡器 MVU 写酒馆（6 条固定正则 + ```html 状态栏 + zod schema 头尾归一）, sync root to v1.31.0 [sync]' || echo 'nothing to commit'
          git push origin HEAD:main
