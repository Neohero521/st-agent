name: Sync extension root from release package

# v1.41.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[sync]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.41.0 package to extension root
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 --max-time 120 -A 'Mozilla/5.0' -o /tmp/pkg.zip 'https://aka.doubaocdn.com/s/6ZUhXBqje9'
          ls -l /tmp/pkg.zip
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          unzip -q /tmp/pkg.zip -d /tmp/pkg
          cp -fR /tmp/pkg/st-agent/. .
          ls -l manifest.json adv-tools-v22.js adv-lib-card-audit.js adv-lib-spec-audit.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'chore: apply v1.41.0 package to extension root [sync]'
          git push
