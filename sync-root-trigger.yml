name: Sync extension root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[sync]')"
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.37.0
        run: |
          set -e
          curl -fL --retry 5 -A 'Mozilla/5.0' -o /tmp/pkg.zip 'https://aka.doubaocdn.com/s/X9OOdNtc9E'
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          unzip -q /tmp/pkg.zip -d /tmp/pkg
          cp -fR /tmp/pkg/st-agent/. .
          ls -l manifest.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'chore: apply v1.37.0 package to extension root [sync]'
          git push
